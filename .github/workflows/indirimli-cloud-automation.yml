name: Indirimli Cloud Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  automation-orchestrator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cloud repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate orchestrator
        run: python -m py_compile automation/core/automation_orchestrator_v1.py

      - name: Run cloud orchestrator
        run: python automation/core/automation_orchestrator_v1.py
