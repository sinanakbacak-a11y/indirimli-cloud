name: Indirimli Cloud Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  automation-preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cloud repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate automation runner
        run: python -m py_compile automation/core/automation_runner_v1.py

      - name: Run permission-gated automation
        run: python automation/core/automation_runner_v1.py

      - name: Validate collector
        run: python -m py_compile automation/core/bulk_official_collector_v1.py

      - name: Run permission-gated collector
        run: python automation/core/bulk_official_collector_v1.py
